plugins {
    id 'net.fabricmc.fabric-loom' version '1.16.1'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

def minecraftVersionRange = project.minecraft_version_range
def minecraftVersionRangeFileLabel = minecraftVersionRange
        .replace(">=", "")
        .replace("<=", "-")
        .replace(">", "")
        .replace("<", "-")
        .replace("[", "")
        .replace("]", "")
        .replace("(", "")
        .replace(")", "")
        .replace(",", "-")
        .replaceAll("\\s+", "")
        .replaceAll("-+", "-")

if ((minecraftVersionRange.startsWith(">=") && !minecraftVersionRange.contains("<"))
        || (minecraftVersionRange.startsWith("[") && minecraftVersionRange.endsWith(",)"))) {
    minecraftVersionRangeFileLabel = minecraftVersionRangeFileLabel.replaceAll('-+$', '') + "+"
}

base {
    archivesName = project.archives_base_name
}

tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = "${project.version}+mc${minecraftVersionRangeFileLabel}"
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version_range", minecraftVersionRange
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "minecraft_version_range": minecraftVersionRange
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    failOnNoDiscoveredTests = false
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
