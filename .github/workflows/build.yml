name: build

# push / PR: 全ローダー × 全対応バージョンを並列にビルドしてテストする。
# v* タグ: テスト済みの jar を下書きリリースに添付する（公開は手動）。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      cache_operation:
        description: キャッシュの操作
        type: choice
        options:
          - rebuild
          - delete
        default: rebuild
        required: true

permissions:
  contents: read

jobs:
  validate-wrapper:
    name: Gradle ラッパーの検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

  cache-maintenance:
    name: キャッシュの削除（手動）
    if: github.event_name == 'workflow_dispatch'
    needs: validate-wrapper
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: GitHub Actions キャッシュをすべて削除
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete --all --succeed-on-no-caches --repo "$GITHUB_REPOSITORY"

  build-and-test:
    name: ${{ matrix.era }} (${{ matrix.mc }})
    needs: [validate-wrapper, cache-maintenance]
    if: >-
      always() &&
      needs.validate-wrapper.result == 'success' &&
      (needs.cache-maintenance.result == 'success' || needs.cache-maintenance.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.cache_operation == 'rebuild')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - era: modern
            mc: '26.1.2'
            distribution: true
          - era: modern
            mc: '26.2'
            distribution: false
          - era: modern
            mc: '26.3'
            distribution: false
          - era: legacy
            mc: '1.21.11'
            distribution: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-home-cache-strict-match: false
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.cache_operation == 'rebuild') }}
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .gradle/loom-cache
          key: ${{ runner.os }}-loom-${{ matrix.mc }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', 'versions/*.properties') }}
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: matrix.era == 'modern'
        with:
          path: |
            .gradle/9.7.1
            neoforge/build/tmp/createMinecraftArtifacts
            neoforge/build/moddev/artifacts
          key: ${{ runner.os }}-moddev-modern-${{ matrix.mc }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', 'versions/*.properties') }}
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: matrix.era == 'legacy'
        with:
          path: |
            .gradle/9.7.1
            neoforge-legacy/build/tmp/createMinecraftArtifacts
            neoforge-legacy/build/moddev/artifacts
          key: ${{ runner.os }}-moddev-legacy-${{ matrix.mc }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', 'versions/*.properties') }}
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .gradle/mavenizer
          key: ${{ runner.os }}-mavenizer-${{ matrix.mc }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties', 'versions/*.properties') }}
      - name: modern の全ローダーをビルドしてテスト
        if: matrix.era == 'modern'
        run: ./gradlew --no-daemon --parallel --configure-on-demand :fabric:build :neoforge:build :forge:build -Pmc=${{ matrix.mc }}
      - name: legacy の全ローダーをビルドしてテスト
        if: matrix.era == 'legacy'
        run: ./gradlew --no-daemon --parallel --configure-on-demand :fabric-legacy:build :neoforge-legacy:build :forge-legacy:build
      - name: modern の配布jarを集める
        if: startsWith(github.ref, 'refs/tags/v') && matrix.era == 'modern' && matrix.distribution
        run: |
          mkdir -p release-artifacts
          cp fabric/build/libs/*.jar neoforge/build/libs/*.jar forge/build/libs/*.jar release-artifacts/
      - name: legacy の配布jarを集める
        if: startsWith(github.ref, 'refs/tags/v') && matrix.era == 'legacy' && matrix.distribution
        run: |
          mkdir -p release-artifacts
          cp fabric-legacy/build/libs/*.jar neoforge-legacy/build/libs/*.jar forge-legacy/build/libs/*.jar release-artifacts/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v') && matrix.era == 'modern' && matrix.distribution
        with:
          name: release-modern
          path: release-artifacts/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v') && matrix.era == 'legacy' && matrix.distribution
        with:
          name: release-legacy
          path: release-artifacts/*.jar
          if-no-files-found: error

  release-assets:
    name: リリース成果物とノートの作成
    if: github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release/
          merge-multiple: true
      - name: タグと mod_version が一致しているか確認
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "タグ ${TAG} と gradle.properties の mod_version (${version}) が違います" >&2
            exit 1
          fi
      - name: SHA-256 とダウンロードリンク付きリリースノートを生成
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          find_jar() {
            local pattern="$1"
            local matches=(release/$pattern)
            if [[ ${#matches[@]} -ne 1 || ! -f "${matches[0]}" ]]; then
              echo "jar が1つ見つかりません: $pattern" >&2
              return 1
            fi
            printf '%s' "${matches[0]##*/}"
          }

          asset_url() {
            printf 'https://github.com/%s/releases/download/%s/%s' "$GITHUB_REPOSITORY" "$TAG" "$1"
          }

          fabric_modern="$(find_jar '*-fabric-*+mc26.1-26.3.jar')"
          neoforge_modern="$(find_jar '*-neoforge-*+mc26.1-26.3.jar')"
          forge_modern="$(find_jar '*-forge-*+mc26.1-26.3.jar')"
          fabric_legacy="$(find_jar '*-fabric-*+mc1.21.11.jar')"
          neoforge_legacy="$(find_jar '*-neoforge-*+mc1.21.11.jar')"
          forge_legacy="$(find_jar '*-forge-*+mc1.21.11.jar')"

          sha256sum release/*.jar | sed 's#release/##' > release/SHA256SUMS.txt
          cat > release/RELEASE_NOTES.md <<EOF
          ## どの jar を使うか

          ローダーと Minecraft のバージョンに合う jar をダウンロードしてください。

          | ローダー | Minecraft | ダウンロード |
          |---|---|---|
          | Fabric | 26.1-26.3 | [jar]($(asset_url "$fabric_modern")) |
          | NeoForge | 26.1-26.3 | [jar]($(asset_url "$neoforge_modern")) |
          | Forge | 26.1-26.3 | [jar]($(asset_url "$forge_modern")) |
          | Fabric | 1.21.11 | [jar]($(asset_url "$fabric_legacy")) |
          | NeoForge | 1.21.11 | [jar]($(asset_url "$neoforge_legacy")) |
          | Forge | 1.21.11 | [jar]($(asset_url "$forge_legacy")) |

          SHA256SUMS.txt と照合してから使用してください。
          EOF
      - name: 下書きのリリースを作る（公開は手動で確認してから）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/*.jar release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes-file release/RELEASE_NOTES.md
